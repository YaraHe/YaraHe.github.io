<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara | 欢迎来到我的博客</title>
    <style>
        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 720px;
            margin: 80px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-link {
            color: #333;
            text-decoration: none;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lang-btn {
            padding: 6px 12px;
            border: 1px solid #333;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .meta {
            font-size: 14px;
            color: #999;
            margin-bottom: 28px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.85;
            margin: 0 0 1em;
        }

        @media (max-width: 600px) {
            .container {
                margin: 40px 16px;
                padding: 28px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <article class="container">
        <div class="top-bar">
            <a class="back-link" href="../blog.html" id="backLink">← 返回博客</a>
            <button class="lang-btn" type="button" onclick="toggleLanguage()" id="langToggle">EN</button>
        </div>

        <h1 id="title">欢迎来到我的博客</h1>
        <p class="meta" id="meta">2026-04-11</p>

        <div class="content">
            <p id="p1">个人主页新增了「博客」页面，用来存放更长的文字：读书笔记、课堂反思、论文备忘等。</p>
            <p id="p2">如果你对这些话题感兴趣，欢迎通过主页上的方式与我交流。</p>
        </div>
    </article>

    <script>
        let isChinese = true;

        const zh = {
            back: "← 返回博客",
            title: "欢迎来到我的博客",
            p1: "个人主页新增了「博客」页面，用来存放更长的文字：读书笔记、课堂反思、论文备忘等。",
            p2: "如果你对这些话题感兴趣，欢迎通过主页上的方式与我交流。"
        };

        const en = {
            back: "← Back to blog",
            title: "Welcome to my blog",
            p1: "This site now has a dedicated blog page for longer writing: reading notes, classroom reflections, paper drafts, and similar material.",
            p2: "If any of this resonates with you, feel free to reach out using the contact options on the home page."
        };

        function applyLang() {
            const t = isChinese ? zh : en;
            document.getElementById("backLink").innerText = t.back;
            document.getElementById("title").innerText = t.title;
            document.getElementById("p1").innerText = t.p1;
            document.getElementById("p2").innerText = t.p2;
            document.getElementById("langToggle").innerText = isChinese ? "EN" : "中";
        }

        function toggleLanguage() {
            isChinese = !isChinese;
            applyLang();
        }
    </script>

</body>
</html>
