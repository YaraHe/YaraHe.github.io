<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/Caveat-wght.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css?v=round6">
  <title>Home — Editorial portfolio prototype</title>
</head>
<body>
  <main class="home" id="home">
    <div class="water" aria-hidden="true"></div>
    <canvas class="reveal" id="reveal" aria-hidden="true"></canvas>

    <div class="composition">
      <aside class="music-player" id="music-player" aria-label="Background music">
        <div class="music-meter" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="music-title" id="music-title">Morning Lake Drift</p>
        <div class="music-transport">
          <button class="music-control" id="music-prev" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M18 6l-10 6 10 6z"/></svg>
          </button>
          <button class="music-control music-play" id="music-play" type="button" aria-label="Play music" aria-pressed="false">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19 12 7 19.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
          </button>
          <button class="music-control" id="music-next" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M6 6l10 6-10 6z"/></svg>
          </button>
        </div>
        <div class="music-level">
          <button class="music-control music-mute" id="music-mute" type="button" aria-label="Mute music" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4zM16 9.5c1.6 1.3 1.6 3.7 0 5M18 7c3 2.6 3 7.4 0 10"/>
              <path class="mute-slash" d="M3 21 21 3"/>
            </svg>
          </button>
          <input id="music-volume" class="music-volume" type="range" min="0" max="1" step="0.01" value="0.22" aria-label="Music volume">
        </div>
        <span class="music-error" id="music-error" hidden>Audio unavailable. Try again.</span>
        <span class="sr-only" id="music-status" aria-live="polite"></span>
        <audio id="music-audio" src="audio/candidates/morning-lake-drift.wav" preload="metadata" loop></audio>
      </aside>
      <h1 class="statement">
        <span>Touch the machine,</span>
        <span>keep the human feeling alive.</span>
      </h1>

      <nav class="entries" aria-label="Portfolio sections">
        <div class="entry-group">
          <a class="entry" href="about/index.html">
            <span class="entry-name">About Me <span class="arrow" aria-hidden="true">↗</span></span>
            <span class="entry-subtitle">The person behind the work.</span>
          </a>
        </div>
        <a class="entry" href="../Stage-4.1-Q1-Editorial-Overview/index.html">
          <span class="entry-name">What I Built <span class="arrow" aria-hidden="true">↗</span></span>
          <span class="entry-subtitle">Ideas made real.</span>
        </a>
        <a class="entry" href="../Stage-5-What-I-Understand-Prototype/index.html">
          <span class="entry-name">What I Understand <span class="arrow" aria-hidden="true">↗</span></span>
          <span class="entry-subtitle">Learning, made sense of.</span>
        </a>
      </nav>
    </div>
  </main>
  <script src="reveal.js"></script>
  <script src="music.js?v=round6"></script>
</body>
</html>
