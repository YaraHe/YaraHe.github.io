      <section class="story" aria-labelledby="story-title">
        <p class="story-index">ONDA ESPAÑOL / LANGUAGE LEARNING</p>
        <h1 id="story-title">一句西语，<br>不止读一遍。</h1>
        <div class="story-problem">
          <p>认识每一个词，未必听得懂一句话。</p>
          <p>读得出每一个音，未必读得出它的起伏。</p>
        </div>
        <p class="story-thesis">语言不只有字词，还有声音的节奏。</p>
        <p class="story-response">从一句真实的西语开始，理解、聆听、模仿，到反馈与反复听熟，慢慢拥有自然的语感。</p>
        <p class="story-close">让西语的起伏，从耳边走向唇齿之间。</p>
